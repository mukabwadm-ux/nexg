<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>NEXG code</title>
<!--
  The page behind the "Copy" button in the code emails: https://www.nexgapp.com/copy-code.html#<code>
  The code is after the # (the fragment), which browsers never send to a server, so it is never logged.
  The page copies it on open (or on one tap where the browser needs a tap), then clears it from the address
  bar and history. No cookies, no storage, no network requests, not indexed.
  Source: langs4u/nexg-app docs/email-templates/copy-code.html. Hosted copy: mukabwadm-ux/nexg
  apps/web/public/copy-code.html. Keep the two the same.
-->
<style>
:root{--bg:#F7F8FA;--soft:#F3F6F7;--ink:#142D35;--btn:#F8C54B;--on:#14242A;--ok:#1E7A4C;--okSoft:#E3F4EA}
@media (prefers-color-scheme:dark){:root{--bg:#080F12;--soft:#1C2C32;--ink:#F3F7F7;--ok:#A5F1B9;--okSoft:#173527}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box}
.code{padding:14px 20px;border-radius:20px;background:var(--soft);font:700 32px/1.2 'SF Mono',Menlo,Consolas,'Courier New',monospace;letter-spacing:4px;white-space:nowrap;-webkit-user-select:all;user-select:all}
button,.state{border:0;border-radius:999px;padding:9px 18px;font-family:inherit;font-size:15px;font-weight:700;line-height:1.2}
button{background:var(--btn);color:var(--on);cursor:pointer}
.state{background:var(--okSoft);color:var(--ok)}
.back{font-size:14px;color:inherit;opacity:.6;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="code" id="code"></div>
  <button type="button" id="copy" hidden>Copy</button>
  <span class="state" id="copied" hidden>&#10003; Copied</span>
</main>
<script>
(function () {
  var code = decodeURIComponent((location.hash || '').slice(1)).replace(/[^0-9A-Za-z]/g, '').slice(0, 12);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var box = document.getElementById('code'), btn = document.getElementById('copy'), ok = document.getElementById('copied');
  if (code.length < 4) { box.textContent = '—'; return; }
  box.textContent = code;
  function done() { btn.hidden = true; ok.hidden = false; }
  function viaSelection() {
    var r = document.createRange(); r.selectNodeContents(box);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var copied = false; try { copied = document.execCommand('copy'); } catch (e) {}
    s.removeAllRanges(); return copied;
  }
  function copy(tap) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () { if (tap && viaSelection()) done(); else btn.hidden = false; });
    } else if (tap && viaSelection()) { done(); } else { btn.hidden = false; }
  }
  btn.addEventListener('click', function () { copy(true); });
  copy(false);
})();
</script>
</body>
</html>
