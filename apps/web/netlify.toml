# Netlify site "nexg-web". Set the site's base directory to apps/web.
[build]
  command = "cd ../.. && pnpm turbo run build --filter=@nexg/web"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAPS_ID,NEXT_PUBLIC_QR_ORIGIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
