# Netlify site "nexg-admin". Set the site's base directory to apps/admin.
[build]
  command = "cd ../.. && pnpm turbo run build --filter=@nexg/admin"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAPS_ID,NEXT_PUBLIC_VAPID_PUBLIC_KEY,STAFF_EMAIL_DOMAIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
