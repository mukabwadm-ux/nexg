<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NexG merchant onboarding journey</title>
  <desc id="desc">A three-part journey: submit a short registration, continue setup from Home, then complete admin review and activation separately.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#203b2e" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#4e8968"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f2ea"/>
  <circle cx="1510" cy="118" r="120" fill="#e8eee5" opacity="0.55"/>
  <circle cx="1464" cy="72" r="46" fill="#f0e7d4" opacity="0.75"/>

  <text x="80" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3" fill="#286246">NEXG MERCHANT  ·  KENYA</text>
  <text x="80" y="151" font-family="Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8" fill="#192d2b">One short registration. A clearer path to launch.</text>
  <text x="80" y="203" font-family="Arial, sans-serif" font-size="24" fill="#61736b">Share the essentials once, then finish setup from your merchant Home.</text>
  <rect x="1323" y="54" width="194" height="46" rx="23" fill="#ffffff" stroke="#d6dfd5"/>
  <text x="1420" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#4b6859">KES  ·  Kenya</text>

  <!-- Journey cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="280" width="440" height="500" rx="24" fill="#ffffff"/>
    <rect x="580" y="280" width="440" height="500" rx="24" fill="#ffffff"/>
    <rect x="1080" y="280" width="440" height="500" rx="24" fill="#ffffff"/>
  </g>

  <!-- Connectors -->
  <path d="M526 532H568" stroke="#4e8968" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1026 532H1068" stroke="#4e8968" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="112" y="311" width="54" height="54" rx="17" fill="#225d40"/>
  <text x="139" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">01</text>
  <text x="182" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#61806d">REGISTER</text>
  <text x="182" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#334b40">One compact page</text>
  <text x="112" y="412" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#192d2b">Share the essentials</text>
  <text x="112" y="445" font-family="Arial, sans-serif" font-size="17" fill="#718078">Only the details needed to get started.</text>

  <g font-family="Arial, sans-serif" font-size="17" fill="#31473d">
    <circle cx="130" cy="493" r="14" fill="#edf5ef"/><path d="M124 493h12M130 487v12" stroke="#286246" stroke-width="2" stroke-linecap="round"/>
    <text x="158" y="499">Business and applicant</text>
    <line x1="112" y1="519" x2="488" y2="519" stroke="#edf0eb"/>

    <circle cx="130" cy="549" r="14" fill="#edf5ef"/><path d="M123 545h14M123 550h14M123 555h9" stroke="#286246" stroke-width="2" stroke-linecap="round"/>
    <text x="158" y="555">Category and subcategories</text>
    <line x1="112" y1="575" x2="488" y2="575" stroke="#edf0eb"/>

    <circle cx="130" cy="605" r="14" fill="#edf5ef"/><path d="M126 599h8a3 3 0 0 1 3 3v7h-14v-7a3 3 0 0 1 3-3Z M128 612h4" stroke="#286246" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="611">Branches and contact details</text>
    <line x1="112" y1="631" x2="488" y2="631" stroke="#edf0eb"/>

    <circle cx="130" cy="661" r="14" fill="#edf5ef"/><path d="M130 652l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10v-5l7-3Z M127 661l2 2 4-5" stroke="#286246" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="667">Registration and required terms</text>
  </g>
  <rect x="112" y="700" width="194" height="28" rx="14" fill="#f5f2ea"/>
  <text x="209" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#69786e">Product updates · optional</text>
  <rect x="112" y="741" width="376" height="1" fill="#edf0eb"/>
  <text x="112" y="765" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#286246">SUBMIT &amp; OPEN HOME</text>
  <path d="M460 758h25m-7-7 7 7-7 7" stroke="#286246" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="612" y="311" width="54" height="54" rx="17" fill="#225d40"/>
  <text x="639" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">02</text>
  <text x="682" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#61806d">SET UP</text>
  <text x="682" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#334b40">Go straight to Home</text>
  <text x="612" y="412" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#192d2b">Continue in Home</text>
  <text x="612" y="445" font-family="Arial, sans-serif" font-size="17" fill="#718078">Your application is saved before Home opens.</text>

  <rect x="612" y="478" width="376" height="88" rx="16" fill="#f3f7f2" stroke="#e3ebe1"/>
  <rect x="632" y="498" width="43" height="43" rx="13" fill="#ffffff"/>
  <path d="M643 529v-13l10-8 10 8v13h-7v-9h-6v9Z" fill="none" stroke="#286246" stroke-width="2" stroke-linejoin="round"/>
  <text x="693" y="513" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2c4639">A personalized setup Home</text>
  <text x="693" y="540" font-family="Arial, sans-serif" font-size="15" fill="#718078">See what is done and what is still needed.</text>

  <g font-family="Arial, sans-serif">
    <circle cx="631" cy="607" r="12" fill="#e7f2e9"/><path d="m626 607 3 3 6-7" stroke="#286246" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="657" y="613" font-size="17" fill="#31473d">Pick up setup in focused tasks</text>
    <circle cx="631" cy="652" r="12" fill="#e7f2e9"/><path d="m626 652 3 3 6-7" stroke="#286246" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="657" y="658" font-size="17" fill="#31473d">Keep working while review is pending</text>
  </g>
  <rect x="612" y="700" width="376" height="48" rx="14" fill="#225d40"/>
  <text x="800" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Continue setup from Home</text>

  <!-- Step 3 -->
  <rect x="1112" y="311" width="54" height="54" rx="17" fill="#225d40"/>
  <text x="1139" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">03</text>
  <text x="1182" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#61806d">REVIEW</text>
  <text x="1182" y="357" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#334b40">Two separate decisions</text>
  <text x="1112" y="412" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#192d2b">Review, then activate</text>
  <text x="1112" y="445" font-family="Arial, sans-serif" font-size="17" fill="#718078">Approval and activation are separate.</text>

  <rect x="1112" y="478" width="376" height="103" rx="16" fill="#f8f6f0" stroke="#ece8dc"/>
  <circle cx="1143" cy="529" r="19" fill="#f0e7d4"/>
  <path d="M1136 530h14M1139 524h8M1139 536h8" stroke="#92733c" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1178" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33473d">Admin review</text>
  <text x="1178" y="547" font-family="Arial, sans-serif" font-size="15" fill="#718078">Your application is checked.</text>
  <rect x="1401" y="502" width="65" height="28" rx="14" fill="#efe9d8"/>
  <text x="1434" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#896d38">PENDING</text>

  <path d="M1143 582v34" stroke="#d6dfd5" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="1112" y="616" width="376" height="103" rx="16" fill="#f3f7f2" stroke="#e3ebe1"/>
  <circle cx="1143" cy="667" r="19" fill="#e3efe5"/>
  <path d="M1134 667l6 6 12-13" stroke="#286246" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1178" y="656" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33473d">Activation</text>
  <text x="1178" y="685" font-family="Arial, sans-serif" font-size="15" fill="#718078">Handled separately after approval.</text>
  <rect x="1112" y="738" width="376" height="26" rx="13" fill="#edf5ef"/>
  <text x="1300" y="756" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#286246">KEEP SETTING UP WHILE YOU WAIT</text>

  <!-- Footer takeaway -->
  <rect x="80" y="820" width="1440" height="108" rx="22" fill="#e8eee5"/>
  <circle cx="126" cy="874" r="23" fill="#225d40"/>
  <path d="M117 875l6 6 13-15" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="866" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#233e32">Keep registration short.</text>
  <text x="170" y="897" font-family="Arial, sans-serif" font-size="16" fill="#5f7266">Move deeper operational details into guided Home tasks.</text>
  <line x1="815" y1="846" x2="815" y2="902" stroke="#cad8cb" stroke-width="1.5"/>
  <text x="858" y="866" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1" fill="#61806d">THE JOURNEY</text>
  <text x="858" y="898" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#233e32">Register  →  Set up  →  Review  →  Activate</text>

  <text x="80" y="968" font-family="Arial, sans-serif" font-size="13" fill="#839087">Merchant onboarding concept · based on the supplied form and current Home handoff</text>
</svg>
