name: Undo 75 once

# One-off: restores the files #75 changed to their state before it (021fb52),
# applies the Home checklist patch and commits. Delete this file before merging.
on:
  push:
    branches: [fix/home-checklist-pre-approval]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-#75 files and apply the Home patch
        run: |
          if [ ! -f .github/workflows/home-checklist.patch ]; then echo "Already applied."; exit 0; fi
          git fetch --no-tags origin chore/format
          BASE=021fb5277c7287e25c96cf9003ce7a667de5c6f1
          git checkout "$BASE" -- \
            'apps/admin/app/merchants/applications/[id]/page.tsx' \
            apps/admin/components/merchants/application-review-controls.test.tsx \
            apps/admin/components/merchants/application-review-controls.tsx \
            apps/admin/components/merchants/application-review-view.tsx \
            apps/web/app/merchant/business/page.tsx \
            apps/web/app/merchant/documents/page.tsx \
            apps/web/app/merchant/layout.tsx \
            apps/web/components/merchant/workspace/merchant-workspace-shell.test.tsx \
            apps/web/components/merchant/workspace/merchant-workspace-shell.tsx \
            apps/web/components/merchant/workspace/workspace.module.css \
            packages/db/src/types.generated.ts
          git rm -q \
            apps/admin/lib/merchant-document-readiness-load.ts \
            apps/admin/lib/merchant-document-readiness.test.ts \
            apps/admin/lib/merchant-document-readiness.ts \
            apps/web/lib/merchant-verification.test.ts \
            apps/web/lib/merchant-verification.ts \
            supabase/migrations/20261113000100_approval_requires_verified_documents.sql \
            supabase/tests/45_approval_requires_verified_documents.sql
          git apply --index .github/workflows/home-checklist.patch
          git rm -q .github/workflows/home-checklist.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Undo #75 and grey out the Home checklist until approval"
          git push
