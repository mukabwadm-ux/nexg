name: Deploy to Netlify

on:
  push:
    branches: [main]

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger web build
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_WEB }}"
      - name: Trigger admin build
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_ADMIN }}"
