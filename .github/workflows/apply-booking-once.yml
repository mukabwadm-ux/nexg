name: Apply booking patch once

# One-off: applies booking.patch.gz.b64 to this branch and commits it.
# Delete this file before merging.
on:
  push:
    branches: [feat/booking-engine-postgres]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: |
          P=.github/workflows/booking.patch.gz.b64
          if [ ! -f "$P" ]; then echo "Already applied."; exit 0; fi
          base64 -d "$P" | gunzip > /tmp/booking.patch
          git apply --index /tmp/booking.patch
          git rm -q "$P"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(booking): run the booking runtime on PostgreSQL in production"
          git push
