name: Discovery engine image

# Builds the discovery engine from discovery/discovery-engine/Dockerfile. On main it publishes the
# image to GitHub Container Registry, so the VPS only pulls a finished image (deploy/vps/README.md).
# On a pull request it only builds, to catch a broken Dockerfile before it lands.
on:
  push:
    branches: [main]
    paths:
      - discovery/discovery-engine/**
      - discovery/docs/discovery/**
      - discovery/assets/icons-web/**
      - discovery/demo-seed/subcategory-map.json
      - .github/workflows/discovery-engine-image.yml
  pull_request:
    paths:
      - discovery/discovery-engine/**
      - discovery/docs/discovery/**
      - discovery/assets/icons-web/**
      - discovery/demo-seed/subcategory-map.json
      - .github/workflows/discovery-engine-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: discovery-engine-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build discovery engine image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: discovery/discovery-engine/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexg-discovery-engine:latest
            ghcr.io/${{ github.repository_owner }}/nexg-discovery-engine:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=NexG discovery engine
          cache-from: type=gha
          cache-to: type=gha,mode=max
