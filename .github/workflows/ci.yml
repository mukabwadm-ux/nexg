name: CI

on:
  pull_request:
    branches: [main, nexg-app]
  push:
    branches: [main, nexg-app]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # NexG Discovery (apps/web build) refuses a local Supabase unless asked; CI builds against one.
  DISCOVERY_ALLOW_LOCAL_SUPABASE: '1'

jobs:
  database:
    name: Migrations, RLS and audit chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned: newer CLIs change `gen types` output (2.121 added
      # ComputedFields), which makes the types check fail with no schema
      # change. Bump deliberately, then run `pnpm db:types` and commit.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Proves the schema rebuilds from an empty database, which is the M2
      # definition of done — not just that it applies to whatever is lying around.
      - name: Start Supabase
        run: supabase start

      - name: Reset from zero
        run: supabase db reset --local

      - name: Lint the schema
        run: supabase db lint --local --level warning

      - name: RLS, audit chain and status gate tests
        run: supabase test db

      # The committed types must match the schema they claim to describe.
      # Runs the same `pnpm db:types` developers run (same schemas, same
      # Prettier config), so the check cannot disagree with the script.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check generated types are current
        run: |
          pnpm db:types
          if ! git diff --exit-code -- packages/db/src/types.generated.ts; then
            echo "::error::packages/db/src/types.generated.ts is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi

      # Lets anyone without Docker download the regenerated file and commit it.
      - name: Upload regenerated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: types-generated
          path: packages/db/src/types.generated.ts
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  booking-postgres:
    name: Booking runtime on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Production stores bookings in PostgreSQL, so the booking suite (including
    # concurrent double-booking checks) and the reviewed migrations run here too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking" --health-interval 5s --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @nexg/booking-engine...

      - name: Booking tests on PostgreSQL
        env:
          BOOKING_TEST_POSTGRES_URL: postgres://booking:booking@localhost:5432/postgres
        run: pnpm --filter @nexg/booking-engine test

      - name: Migrations apply to an empty database
        env:
          PGPASSWORD: booking
          BOOKING_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_migrations
        run: |
          psql -h localhost -U booking -d postgres -c 'create database booking_migrations'
          pnpm --filter @nexg/booking-engine migrate

  verify:
    name: Install, build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Supabase
        run: supabase start

      - name: Point the apps at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # NexG Discovery (discovery/) is its own npm project outside the pnpm workspace. `pnpm build` installs it
      # when it builds /discover; install here too in case that build came from the Turbo cache.
      - name: Test NexG Discovery
        run: |
          test -d discovery/node_modules/vite || npm ci --prefix discovery --include=dev --no-audit --no-fund
          npm --prefix discovery test

      - name: Check formatting
        run: pnpm format:check

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both apps need a Supabase to start, and the admin suite signs in as
      # the staff user `supabase/seed.sql` creates, so run the local stack.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Supabase
        run: supabase start

      # NEXT_PUBLIC_* values are inlined at build time, so these must be
      # set before `pnpm build`, not just before the servers start.
      - name: Point the apps at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
