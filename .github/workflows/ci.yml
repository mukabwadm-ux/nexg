name: CI

on:
  # Every pull request, including ones stacked on another branch: those used to
  # get no checks at all until they were re-pointed at main.
  pull_request:
  push:
    branches: [main, nexg-app]
  workflow_dispatch:
    inputs:
      ui_acceptance:
        description: Run browser acceptance (requires owner testing approval)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # NexG Discovery (apps/web build) refuses a local Supabase unless asked; CI builds against one.
  DISCOVERY_ALLOW_LOCAL_SUPABASE: '1'

jobs:
  # About a minute, so the two most common mistakes show up before the 10-minute jobs finish.
  quick-checks:
    name: Quick checks (migration ids, formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # On a pull request, new migrations must sort after the base branch's latest
      # and nothing already on the base may be edited or removed.
      - name: Migration ids are unique and in order
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migration-ids.mjs ${BASE_REF:+origin/$BASE_REF}

      # Compares by what the SQL does: no two migrations with the same statements,
      # none that only repeats what already ran (on main or on the live database),
      # no id the live database ran under another name, and no "already applied"
      # repair without a content match (supabase/live-history).
      - name: Migrations do not repeat each other or what live already ran
        run: node scripts/check-migration-repeats.mjs --report

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: |
          if ! pnpm format:check; then
            echo "::error::Some files are not formatted. Run 'pnpm format' (or 'pnpm exec prettier --write <file>') and commit the result."
            exit 1
          fi

  maps-services:
    name: Map service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Injected route provider, authentication and quota boundaries
        run: node --test supabase/functions/maps-routes/handler.test.ts

  native-push:
    name: Phone push payloads and sender
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lock-screen words, APNs and FCM payloads, retries and token retirement
        run: node --test supabase/functions/native-push-dispatch/native-push.test.ts

  app-emails:
    name: App emails sender and templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: HTML part to Resend with the sender injected, and templates in step with the design
        run: node --test supabase/functions/notify-dispatch/email.test.ts

  database:
    name: Migrations, RLS and audit chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned: newer CLIs change `gen types` output (2.121 added
      # ComputedFields), which makes the types check fail with no schema
      # change. Bump deliberately, then run `pnpm db:types` and commit.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Proves the schema rebuilds from an empty database, which is the M2
      # definition of done — not just that it applies to whatever is lying around.
      # One retry: image pulls hit the registry's rate limit and the runner's
      # ports are sometimes still held, which fails the job before any test runs.
      - name: Start Supabase
        run: |
          supabase start || {
            echo "::warning::supabase start failed; retrying once in 20s"
            supabase stop --no-backup || true
            sleep 20
            supabase start
          }

      - name: Reset from zero
        run: supabase db reset --local

      - name: Lint the schema
        run: supabase db lint --local --level warning

      - name: RLS, audit chain and status gate tests
        run: supabase test db

      # The committed types must match the schema they claim to describe.
      # Runs the same `pnpm db:types` developers run (same schemas, same
      # Prettier config), so the check cannot disagree with the script.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check generated types are current
        run: |
          pnpm db:types
          if ! git diff --exit-code -- packages/db/src/types.generated.ts; then
            echo "::error::packages/db/src/types.generated.ts is stale: a migration changed the schema but the types file was not regenerated. Run 'pnpm db:reset && pnpm db:types' and commit the result, or (no Docker) download the 'types-generated' artifact from this run's Summary page and commit it as packages/db/src/types.generated.ts."
            exit 1
          fi

      # Lets anyone without Docker download the regenerated file and commit it.
      - name: Upload regenerated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: types-generated
          path: packages/db/src/types.generated.ts
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Builds a database at the live database's recorded state (11 Nov 2026: main's
  # files plus the archived 20261111 block), applies the rollout's repairs, checks
  # the dry run lists exactly the plan, pushes with --include-all as the owner
  # will on live, and compares the result with a database built fresh from main.
  # No secrets: only the local stack. See docs/database/live-rollout-2026-11-23.md.
  live-rollout:
    name: Live rollout rehearsal (live's 11 Nov state to main)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Rehearse the rollout
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/live-rollout
        run: bash scripts/live-rollout-rehearsal.sh

      - name: Upload the rehearsal's lists and schema diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rollout-rehearsal
          path: |
            ${{ runner.temp }}/live-rollout/*.txt
            ${{ runner.temp }}/live-rollout/*.sql
            ${{ runner.temp }}/live-rollout/repairs.sh
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  booking-postgres:
    name: Booking runtime on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Production stores bookings in PostgreSQL, so the booking suite (including
    # concurrent double-booking checks) and the reviewed migrations run here too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking" --health-interval 5s --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @nexg/booking-engine...

      - name: Booking tests on PostgreSQL
        env:
          BOOKING_TEST_POSTGRES_URL: postgres://booking:booking@localhost:5432/postgres
        run: pnpm --filter @nexg/booking-engine test

      - name: Migrations apply to an empty database
        env:
          PGPASSWORD: booking
          BOOKING_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_migrations
        run: |
          psql -h localhost -U booking -d postgres -c 'create database booking_migrations'
          pnpm --filter @nexg/booking-engine migrate

  verify:
    name: Install, build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # One retry: image pulls hit the registry's rate limit and the runner's
      # ports are sometimes still held, which fails the job before any test runs.
      - name: Start Supabase
        run: |
          supabase start || {
            echo "::warning::supabase start failed; retrying once in 20s"
            supabase stop --no-backup || true
            sleep 20
            supabase start
          }

      - name: Point the apps at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # NexG Discovery (discovery/) is its own npm project outside the pnpm workspace. `pnpm build` installs it
      # when it builds /discover; install here too in case that build came from the Turbo cache.
      - name: Test NexG Discovery
        run: |
          test -d discovery/node_modules/vite || npm ci --prefix discovery --include=dev --no-audit --no-fund
          npm --prefix discovery test

      - name: Check formatting
        run: pnpm format:check

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  discovery-engine:
    name: Discovery engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The engine is its own npm project and needs Node 24 (its package.json engines field).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: discovery/discovery-engine/package-lock.json

      - name: Install
        run: npm ci --prefix discovery/discovery-engine --no-audit --no-fund

      - name: Check the icon pins are current
        run: node discovery/discovery-engine/scripts/pin-web-icons.mjs --check

      - name: Typecheck, test and build
        run: npm --prefix discovery/discovery-engine run check

  e2e:
    name: Playwright
    if: github.event_name != 'workflow_dispatch' || inputs.ui_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both apps need a Supabase to start, and the admin suite signs in as
      # the staff user `supabase/seed.sql` creates, so run the local stack.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # One retry: image pulls hit the registry's rate limit and the runner's
      # ports are sometimes still held, which fails the job before any test runs.
      - name: Start Supabase
        run: |
          supabase start || {
            echo "::warning::supabase start failed; retrying once in 20s"
            supabase stop --no-backup || true
            sleep 20
            supabase start
          }

      # NEXT_PUBLIC_* values are inlined at build time, so these must be
      # set before `pnpm build`, not just before the servers start.
      - name: Point the apps at local Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
