name: Format once

# One-off: formats the repo with the pinned Prettier and commits the result to
# this branch. Delete this file before merging.
on:
  push:
    branches: [chore/format]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Twice: a few files only settle on the second pass.
      - name: Format
        run: |
          pnpm format
          pnpm format
          pnpm format:check

      - name: Commit
        run: |
          if git diff --quiet; then echo "Nothing to format."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: format the repo with Prettier"
          git push
