name: nexg-discovery-search
services:
  typesense:
    image: typesense/typesense:30.2
    ports:
      - "127.0.0.1:8108:8108"
    environment:
      TYPESENSE_API_KEY: ${DISCOVERY_SEARCH_API_KEY:?Use the search:up helper}
    command: ["--data-dir=/data", "--api-port=8108"]
    volumes:
      - search_data:/data
    mem_limit: 2g
    cpus: 2
    restart: "no"
volumes:
  search_data:
