<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your NexG verification code</title>
  </head>
  <body style="margin:0;background:#f5f2ea;color:#171717;font-family:Arial,sans-serif;">
    <main style="max-width:480px;margin:32px auto;padding:28px;background:#ffffff;border-radius:16px;">
      <p style="margin:0;color:#9c7407;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;">NexG</p>
      <h1 style="margin:16px 0;font-size:24px;">Your verification code</h1>
      <p style="font-size:16px;line-height:1.5;">Use this code to verify your email or sign in to NexG:</p>
      <p style="margin:24px 0;font-size:32px;font-weight:700;letter-spacing:.16em;">{{ .Token }}</p>
      <p style="color:#555;font-size:14px;line-height:1.5;">This code expires. If you did not request it, you can ignore this email.</p>
    </main>
  </body>
</html>
